# Security headers for the web app's own pages and assets (not for /api, which sets its own).
# Included from each location in nginx.conf: nginx drops server-level add_header lines in any
# location that sets headers itself, so they are repeated per location through this file.
# Keep CONTENT_SECURITY_POLICY in vite.config.ts in step with the policy here.

# Scripts only from this site; no inline or injected scripts. Inline styles are allowed because
# the dialog and toast libraries add <style> elements; styles cannot run code.
# The document preview frames file links from this same site (/api/v1/files/...).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
